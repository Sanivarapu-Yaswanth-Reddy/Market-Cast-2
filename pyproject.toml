[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketcast"
version = "0.1.0"
description = "Probabilistic scenario engine for Indian equities (internal research; no buy/sell output)"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "pyyaml"]

[project.optional-dependencies]
data = ["duckdb", "statsmodels", "arch", "lightgbm", "scikit-learn"]
dev = ["pytest", "hypothesis", "scoringrules", "properscoring", "statsmodels", "ruff", "black"]
gpu = ["torch", "torch-geometric", "mlflow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
